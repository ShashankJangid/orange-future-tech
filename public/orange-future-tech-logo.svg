<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8C38" />
      <stop offset="60%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#E05300" />
    </linearGradient>

    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA86B" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <linearGradient id="metalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2F3D" />
      <stop offset="50%" stop-color="#181C24" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FF6B00" flood-opacity="0.35" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#FFE0CC" flood-opacity="0.6" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left: 100, 100 center) -->
  <g transform="translate(100, 100)">
    <!-- Outer Shield / Precision Squircle Background -->
    <rect x="-70" y="-70" width="140" height="140" rx="34" fill="url(#metalDark)" stroke="#FF6B00" stroke-width="2" stroke-opacity="0.3" filter="url(#softShadow)" />

    <!-- Stylized Citrus / Cybernetic Orbit Segments -->
    <!-- Segment Top Right -->
    <path d="M 0 -54 A 54 54 0 0 1 54 0 L 36 0 A 36 36 0 0 0 0 -36 Z" fill="url(#orangeGlow)" opacity="0.95" />
    
    <!-- Segment Bottom Right -->
    <path d="M 54 0 A 54 54 0 0 1 0 54 L 0 36 A 36 36 0 0 0 36 0 Z" fill="url(#orangeGlow)" opacity="0.8" />
    
    <!-- Segment Bottom Left -->
    <path d="M 0 54 A 54 54 0 0 1 -54 0 L -36 0 A 36 36 0 0 0 0 36 Z" fill="url(#orangeGlow)" opacity="0.95" />
    
    <!-- Segment Top Left -->
    <path d="M -54 0 A 54 54 0 0 1 0 -54 L 0 -36 A 36 36 0 0 0 -36 0 Z" fill="url(#orangeGlow)" opacity="0.8" />

    <!-- Central Microprocessor AI Core (Silicon Die) -->
    <rect x="-20" y="-20" width="40" height="40" rx="8" fill="#0A0D14" stroke="url(#coreGlow)" stroke-width="2.5" />
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="url(#orangeGlow)" filter="url(#innerGlow)" />

    <!-- PCB Circuit Traces & Bus Interconnects -->
    <!-- North Trace -->
    <line x1="0" y1="-20" x2="0" y2="-48" stroke="#FF8C38" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="-48" r="3.5" fill="#FFFFFF" stroke="#FF6B00" stroke-width="2" />
    
    <!-- East Trace & Bus -->
    <path d="M 20 0 L 34 0 L 44 -10" fill="none" stroke="#FF8C38" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="44" cy="-10" r="3.5" fill="#FFFFFF" stroke="#FF6B00" stroke-width="2" />
    
    <!-- South Trace -->
    <line x1="0" y1="20" x2="0" y2="48" stroke="#FF8C38" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="48" r="3.5" fill="#FFFFFF" stroke="#FF6B00" stroke-width="2" />
    
    <!-- West Trace & Bus -->
    <path d="M -20 0 L -34 0 L -44 10" fill="none" stroke="#FF8C38" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-44" cy="10" r="3.5" fill="#FFFFFF" stroke="#FF6B00" stroke-width="2" />

    <!-- Diagonal Node Accents -->
    <circle cx="-24" cy="-24" r="2.5" fill="#FF8C38" />
    <circle cx="24" cy="24" r="2.5" fill="#FF8C38" />
    <line x1="-15" y1="-15" x2="-22" y2="-22" stroke="#FF8C38" stroke-width="1.5" stroke-dasharray="2 2" />
    <line x1="15" y1="15" x2="22" y2="22" stroke="#FF8C38" stroke-width="1.5" stroke-dasharray="2 2" />

    <!-- Autonomous Pulse / Quantum Dot in Core -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- TYPOGRAPHY / WORDMARK (Right) -->
  <g transform="translate(200, 0)">
    <!-- Primary Wordmark -->
    <text x="0" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Outfit', 'Space Grotesk', 'Segoe UI', sans-serif" font-weight="800" font-size="44" letter-spacing="1.5">
      <tspan fill="#FF6B00">ORANGE </tspan>
      <tspan fill="#FFFFFF">FUTURE </tspan>
      <tspan fill="#94A3B8" font-weight="600">TECH</tspan>
    </text>

    <!-- Subtitle / Discipline Tags -->
    <g transform="translate(4, 130)">
      <rect x="0" y="-15" width="4" height="15" rx="2" fill="#FF6B00" />
      <text x="14" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'SF Mono', monospace" font-size="12.5" font-weight="600" fill="#94A3B8" letter-spacing="2.5">
        SOFTWARE <tspan fill="#FF6B00">•</tspan> PCB ELECTRONICS <tspan fill="#FF6B00">•</tspan> AUTONOMOUS AI
      </text>
    </g>

    <!-- Sleek bottom divider line with gradient accent -->
    <line x1="4" y1="148" x2="520" y2="148" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
    <line x1="4" y1="148" x2="140" y2="148" stroke="#FF6B00" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
